# kind doesn't expose NodePorts to the host by default -- this maps the
# service's nodePort (30080) to the same port on localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: activation-probe
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
