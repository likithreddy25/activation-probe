name: 'activation_probe'
version: '1.0.0'
config-version: 2

profile: 'activation_probe'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  activation_probe:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  activation_probe:
    +schema: seeds
    labeled_eval_examples:
      +column_types:
        label: integer
