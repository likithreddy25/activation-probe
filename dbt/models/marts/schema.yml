version: 2

models:
  - name: mart_daily_flag_rate
    description: Daily request volume and raw flag rate, all traffic.
    columns:
      - name: request_date
        tests: [not_null, unique]

  - name: mart_category_breakdown
    description: Per-category volume, flag rate, and mean probe score.
    columns:
      - name: category
        tests: [not_null, unique]

  - name: mart_fpr_trend
    description: >
      Daily and rolling-7-day false-positive rate, computed only over
      logged requests that match a known-benign example in
      labeled_eval_examples. Excludes unlabeled traffic rather than
      assuming it's benign.
    columns:
      - name: request_date
        tests: [not_null, unique]
