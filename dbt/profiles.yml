activation_probe:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'probe') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'probe') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'activation_probe') }}"
      schema: analytics
      threads: 4
