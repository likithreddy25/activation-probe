[project]
name = "activation-probe"
version = "0.1.0"
description = "Linear probes on open-weight LLM activations for cheap jailbreak/policy-violation detection, served as a monitored FastAPI service."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "torch>=2.3",
  "transformers>=4.44",
  "nnsight>=0.3",
  "datasets>=2.20",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "openai>=1.35",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-mock>=3.14",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
